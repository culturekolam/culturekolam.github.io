<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Kolam pattern in yellow -->
  <g transform="translate(165, 15)">
    <!-- Yellow Kolam pattern - 3 interlocking circles/dots -->
    <circle cx="0" cy="0" r="8" fill="#F5D547"/>
    <circle cx="12" cy="-8" r="8" fill="#F5D547"/>
    <circle cx="12" cy="8" r="8" fill="#F5D547"/>
    <circle cx="8" cy="0" r="6" fill="#F9E589"/>
    <!-- Small decorative dots -->
    <circle cx="-5" cy="-5" r="2.5" fill="#F5D547"/>
    <circle cx="-5" cy="5" r="2.5" fill="#F5D547"/>
    <circle cx="20" cy="0" r="2.5" fill="#F5D547"/>
  </g>
  
  <!-- Tamil text "கோலம்" -->
  <text x="10" y="32" font-family="Arial, sans-serif" font-size="20" font-weight="500" fill="#1d1d1f">கோலம்</text>
  
  <!-- English text "Cultures" in stylized script -->
  <text x="10" y="52" font-family="'Brush Script MT', cursive, serif" font-size="24" font-weight="400" fill="#C84A5A" style="font-style: italic;">Cultures</text>
</svg>
